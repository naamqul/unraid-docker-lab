use_default_settings: true

general:
  debug: false
  instance_name: Arc Search

search:
  safe_search: 0
  autocomplete: duckduckgo
  # Instance-wide; SearXNG has no per-engine format setting. json/csv/rss turn
  # /search into an unauthenticated API for anything that can reach the vhost.
  formats:
    - html
    - json
    - csv
    - rss

server:
  secret_key: ultrasecretkey
  limiter: false
  image_proxy: true

ui:
  static_use_hash: true
  theme_args:
    simple_style: dark
