name: ai

x-qwen38-openvino: &qwen38-openvino
  image: ghcr.io/ggml-org/llama.cpp:server-openvino@sha256:04862a03faabcb1338d0e17d6cbd1ec6e994e17a69af63ed3da40d55d28e8ce4
  init: true
  restart: "no"
  mem_limit: 38g
  memswap_limit: 38g
  environment:
    GGML_OPENVINO_DEVICE: NPU
  devices:
    - /dev/accel/accel0:/dev/accel/accel0
  volumes:
    - /mnt/cache/models/Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF:/models:ro
  networks:
    - caddy-backend
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 2m
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

x-qwen38-openvino-gpu-env: &qwen38-openvino-gpu-env
  GGML_OPENVINO_DEVICE: GPU
  GGML_OPENVINO_STATEFUL_EXECUTION: "0"
  GGML_OPENVINO_REDUCE_COMPILE_MEM: "1"
  GGML_OPENVINO_RELEASE_WEIGHTS: "0"
  GGML_OPENVINO_PROFILING: "1"

x-qwen38-openvino-gpu: &qwen38-openvino-gpu
  image: ghcr.io/ggml-org/llama.cpp:server-openvino@sha256:04862a03faabcb1338d0e17d6cbd1ec6e994e17a69af63ed3da40d55d28e8ce4
  init: true
  restart: "no"
  mem_limit: 40g
  memswap_limit: 40g
  entrypoint:
    - /bin/sh
    - /bench/openvino-gpu-runner.sh
  devices:
    - /dev/dri:/dev/dri
  volumes:
    - ./qwen38/openvino-gpu-runner.sh:/bench/openvino-gpu-runner.sh:ro
    - /mnt/cache/models/Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF:/models:ro
  networks:
    - caddy-backend
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 2m
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

x-qwen38-openvino-f16: &qwen38-openvino-f16
  image: ghcr.io/ggml-org/llama.cpp:server-openvino@sha256:04862a03faabcb1338d0e17d6cbd1ec6e994e17a69af63ed3da40d55d28e8ce4
