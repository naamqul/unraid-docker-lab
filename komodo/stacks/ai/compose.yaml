services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    # This stack deliberately shares the one Gluetun namespace owned by the
    # general stack. Deploy general before ai, and redeploy ai whenever Gluetun
    # is recreated rather than merely restarted.
    network_mode: "container:gluetun"
    environment:
      PORT: "3000"
      WEBUI_URL: https://open-webui.arc.bonfireboogie.com
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - /mnt/user/appdata/open-webui-state/data:/app/backend/data

  qwen38-upstream:
    container_name: qwen38-upstream
    image: ghcr.io/mostlygeek/llama-swap:cpu@sha256:f06135baf7195a2e3bb43fabff9e348a9f192e26644e6c758b090df965a2ab41
    profiles: [qwen38-upstream]
    init: true
    restart: "no"
    mem_limit: 38g
    memswap_limit: 38g
    ports:
      - "127.0.0.1:9293:8080"
    volumes:
      - ./qwen38/upstream.yaml:/app/config.yaml:ro
      - /mnt/cache/models/Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF:/models:ro
    networks:
      - caddy-backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  qwen38-sycl:
    container_name: qwen38-sycl
    image: ghcr.io/mostlygeek/llama-swap:v250-intel-b10450@sha256:4a28ac2941438751ee129e80861aff83fb77a6e88f7fdb9845ca04eb72e22a25
    profiles: [qwen38-sycl]
    init: true
    restart: "no"
    mem_limit: 38g
    memswap_limit: 38g
    environment:
      ONEAPI_DEVICE_SELECTOR: level_zero:gpu
      GGML_SYCL_ENABLE_LEVEL_ZERO: "1"
      UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
      ZES_ENABLE_SYSMAN: "1"
      SYCL_CACHE_PERSISTENT: "1"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "127.0.0.1:9299:8080"
    volumes:
      - ./qwen38/sycl.yaml:/app/config.yaml:ro
      - /mnt/cache/models/Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF:/models:ro
    networks:
      - caddy-backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  qwen38-vulkan:
    container_name: qwen38-vulkan
    image: ghcr.io/mostlygeek/llama-swap:unified-vulkan@sha256:37d51ee2973b811e1f302073061684b245963a74e252c5d013fb099d622b1f7f
