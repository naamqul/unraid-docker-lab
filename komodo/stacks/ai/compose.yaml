name: ai

services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    # This stack deliberately shares the one Gluetun namespace owned by the
    # general stack. Deploy general before ai, and redeploy ai whenever Gluetun
    # is recreated rather than merely restarted.
    network_mode: "container:gluetun"
    environment:
      PORT: "3000"
      WEBUI_URL: https://open-webui.arc.bonfireboogie.com
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - /mnt/user/appdata/open-webui-state/data:/app/backend/data

  # CPU-only Gemma 4 router. llama-swap keeps the proxy small while idle and
  # unloads the single model process after ten minutes.
  gemma4:
    # :cpu is llama-swap's current CPU-only channel. Model artifacts and the
    # official chat template remain revision-pinned independently.
    image: ghcr.io/mostlygeek/llama-swap:cpu
    container_name: gemma4
    init: true
    restart: unless-stopped
    mem_limit: 32g
    memswap_limit: 32g
    oom_score_adj: 500
    # Keep inference subordinate if it competes with interactive host work.
    cpu_shares: 256
    cpuset: "0-15"
    ports:
      - "127.0.0.1:9315:8080"
    volumes:
      - ./gemma4/production.yaml:/app/config.yaml:ro
      - ./gemma4/chat_template.jinja:/app/chat_template.jinja:ro
      - /mnt/cache/models/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP--f9093662a2e7ae0503f637088bc96f77a1a70c83:/models:ro
    networks:
      - caddy-backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

networks:
  caddy-backend:
    external: true
