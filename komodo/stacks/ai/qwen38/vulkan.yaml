healthCheckTimeout: 3600
logLevel: info
logToStdout: both
sendLoadingState: true
includeAliasesInList: true
globalTTL: 600
startPort: 10001

models:
  qwen38-vulkan-262k-base:
    cmd: >-
      /usr/local/bin/llama-server --port ${PORT}
      --model /models/Qwen3.8-27B-ABLITERATED-Q6_K.gguf
      --mmproj /models/mmproj-Qwen3.8-27B-ABLITERATED-F16.gguf
      --alias qwen38-vulkan-262k-base
      --host 127.0.0.1 --parallel 1 --ctx-size 262144
      --device Vulkan0 --gpu-layers all --split-mode none --main-gpu 0
      --threads 16 --threads-batch 16
      --batch-size 2048 --ubatch-size 512 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --cache-ram 0 --ctx-checkpoints 0 --no-cache-idle-slots
      --image-max-tokens 1024 --mtmd-batch-max-tokens 1024
      --fit off --no-context-shift --no-warmup --mmap
      --jinja --metrics --slots --perf --timeout 3600
    checkEndpoint: /health
  qwen38-vulkan-262k-mtp1:
    cmd: >-
      /usr/local/bin/llama-server --port ${PORT}
      --model /models/Qwen3.8-27B-ABLITERATED-Q6_K.gguf
      --mmproj /models/mmproj-Qwen3.8-27B-ABLITERATED-F16.gguf
      --alias qwen38-vulkan-262k-mtp1
      --host 127.0.0.1 --parallel 1 --ctx-size 262144
      --device Vulkan0 --gpu-layers all --split-mode none --main-gpu 0
      --threads 16 --threads-batch 16
      --batch-size 2048 --ubatch-size 512 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --cache-ram 0 --ctx-checkpoints 0 --no-cache-idle-slots
      --image-max-tokens 1024 --mtmd-batch-max-tokens 1024
      --spec-type draft-mtp --spec-draft-n-max 1 --spec-draft-p-min 0.0
      --spec-draft-device Vulkan0 --spec-draft-ngl all
      --fit off --no-context-shift --no-warmup --mmap
      --jinja --metrics --slots --perf --timeout 3600
    checkEndpoint: /health
