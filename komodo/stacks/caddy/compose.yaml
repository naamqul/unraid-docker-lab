name: caddy

services:
  caddy:
    container_name: caddy
    # Follow the current Caddy v2 channel while keeping the custom builder and
    # runtime on the same major for module/Caddyfile compatibility.
    image: arc-caddy-porkbun:2
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
      # Arc's Docker default bridge is registered but has no docker0 device;
      # use host networking only for the ephemeral xcaddy build step.
      network: host
    restart: unless-stopped
    environment:
      CADDY_LAN_IP: ${CADDY_LAN_IP}
      PORKBUN_API_KEY: ${PORKBUN_API_KEY:?Set PORKBUN_API_KEY in .env}
      PORKBUN_API_SECRET_KEY: ${PORKBUN_API_SECRET_KEY:?Set PORKBUN_API_SECRET_KEY in .env}
    depends_on:
      - unraid-webui-bridge
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_STATE_PATH}/data:/data
      - ${CADDY_STATE_PATH}/config:/config
    networks:
      lan:
        ipv4_address: ${CADDY_LAN_IP}
        mac_address: ${CADDY_LAN_MAC}
      caddy-backend:
        # Keep this stable so Jellyfin can trust only Caddy, not every
        # container attached to the shared backend network.
        ipv4_address: ${CADDY_BACKEND_IP:-172.20.0.10}
    labels:
      net.unraid.docker.webui: "https://caddy.arc.bonfireboogie.com/"

  unraid-webui-bridge:
    container_name: unraid-webui-bridge
    image: caddy:2
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8080
      - --to
      - http://192.168.50.51:80
    networks:
      - caddy-backend

  blackwell-llama-relay:
    container_name: blackwell-llama-relay
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/relay.Caddyfile
      - --adapter
      - caddyfile
    volumes:
      - ./blackwell-llama-relay.Caddyfile:/etc/caddy/relay.Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://172.20.0.1:9293/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  lan:
    name: br0
    external: true
  caddy-backend:
    name: caddy-backend
    external: true
